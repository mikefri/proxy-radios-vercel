<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test des flux radios</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      background-image: radial-gradient(circle at top left, #0f0c29, #302b63, #24243e);
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      color: white;
      min-height: 100vh;
    }

    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(20, 20, 20, 0.8);
      backdrop-filter: blur(15px);
      padding: 20px 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0, 255, 255, 0.4);
    }

    h1 {
      font-size: 2.8em;
      margin: 0 0 20px;
      background: linear-gradient(90deg, #00ffe0, #ff00ff, #00ffe0);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: neonText 3s linear infinite;
    }

    @keyframes neonText {
      0% { background-position: 0% center; }
      50% { background-position: 100% center; }
      100% { background-position: 0% center; }
    }

    #progress {
      width: 100%;
      background: #ddd;
      border-radius: 5px;
      margin-top: 20px;
      height: 20px;
    }

    #progress-bar {
      height: 100%;
      width: 0;
      background: #4caf50;
      border-radius: 5px;
    }

    table {
      margin-top: 30px;
      width: 100%;
      border-collapse: collapse;
      color: white;
    }

    th, td {
      padding: 8px;
      border: 1px solid #ddd;
      text-align: left;
    }

    th {
      background-color: #f2f2f2;
      color: #24243e;
    }

    .radio-item {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 0, 255, 0.3);
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .radio-item:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px rgba(255, 0, 255, 0.5);
    }

    .radio-item img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 10px;
    }

    .name {
      font-weight: bold;
      color: #00ffe0;
      margin-bottom: 5px;
    }

    .genre {
      font-size: 0.9em;
      color: #bbb;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <h1>Vérification des flux radios</h1>
  </div>
  <div id="progress">
    <div id="progress-bar"></div>
  </div>
  <div id="resultats">Chargement...</div>

  <h2>Récapitulatif des résultats</h2>
  <table id="table-recaps">
    <thead>
      <tr>
        <th>Nom de la radio</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const resultats = document.getElementById("resultats");
    const progressBar = document.getElementById("progress-bar");
    const recapTable = document.getElementById("table-recaps").getElementsByTagName('tbody')[0];

    async function verifierRadios() {
      try {
        const res = await fetch("https://raw.githubusercontent.com/mikefri/radios-data/refs/heads/main/radios.json");
        const radios = await res.json();
        const totalRadios = radios.length;
        let count = 0;

        // Mettre à jour la barre de progression
        function updateProgress() {
          const percentage = (count / totalRadios) * 100;
          progressBar.style.width = `${percentage}%`;
        }

        resultats.innerHTML = ""; // Masquer les tests en cours

        // Parcourir les radios et vérifier leur état
        for (const radio of radios) {
          const name = radio.name || "Sans nom";
          const url = radio.url || radio.stream;

          if (!url) continue;

          // Ajouter un nouvel élément dans le tableau récapitulatif
          const row = recapTable.insertRow();
          const cellName = row.insertCell(0);
          const cellStatus = row.insertCell(1);
          cellName.textContent = name;
          cellStatus.textContent = "Test en cours...";

          try {
            const response = await fetch(`/api/check?url=${encodeURIComponent(url)}`);
            const data = await response.json();

            if (data.ok && data.contentType.startsWith("audio")) {
              cellStatus.innerHTML = '<span class="ok">OK</span>';
            } else {
              cellStatus.innerHTML = `<span class="ko">Problème (${data.status})</span>`;
            }
          } catch (err) {
            cellStatus.innerHTML = '<span class="ko">Erreur</span>';
          }

          count++;
          updateProgress();
        }

        // Finaliser la barre de progression une fois le test terminé
        updateProgress();
      } catch (e) {
        resultats.textContent = "Erreur de chargement du fichier radios.json.";
      }
    }

    verifierRadios();
  </script>
</body>
</html>
