<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Test des flux radios</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f9f9fb;
      margin: 0;
      padding: 0;
    }

    header {
      background: #4a90e2;
      color: white;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    main {
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }

    .radio {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      margin-bottom: 10px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .status {
      font-weight: bold;
      padding: 6px 10px;
      border-radius: 4px;
    }

    .ok { background: #d4edda; color: #2e7d32; }
    .ko { background: #f8d7da; color: #c62828; }
    .loading { background: #fff3cd; color: #856404; }

    .summary {
      margin-top: 30px;
      padding: 20px;
      background: #e9ecef;
      border-radius: 6px;
      font-size: 1.1em;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .error { color: red; }

    @media (max-width: 600px) {
      .radio {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Vérification des flux radios</h1>
  </header>

  <main>
    <div id="resultats">Chargement...</div>
    <div id="resume" class="summary" style="display:none;"></div>
  </main>

  <script>
    const resultats = document.getElementById("resultats");
    const resume = document.getElementById("resume");

    async function verifierRadios() {
      try {
        const res = await fetch("https://raw.githubusercontent.com/mikefri/radios-data/refs/heads/main/radios.json");
        const radios = await res.json();

        let total = 0, ok = 0, ko = 0;

        resultats.innerHTML = "";
        for (const radio of radios) {
          const name = radio.name || "Sans nom";
          const url = radio.url || radio.stream;
          if (!url) continue;

          total++;

          const div = document.createElement("div");
          div.className = "radio";
          div.innerHTML = `<span>${name}</span><span class="status loading">Test...</span>`;
          resultats.appendChild(div);

          try {
            const response = await fetch(`/api/check?url=${encodeURIComponent(url)}`);
            const data = await response.json();

            if (data.ok && data.contentType?.startsWith("audio")) {
              div.querySelector(".status").textContent = "OK";
              div.querySelector(".status").className = "status ok";
              ok++;
            } else {
              div.querySelector(".status").textContent = `Problème (${data.status || "?"})`;
              div.querySelector(".status").className = "status ko";
              ko++;
            }
          } catch (err) {
            div.querySelector(".status").textContent = "Erreur";
            div.querySelector(".status").className = "status ko";
            ko++;
          }
        }

        resume.style.display = "block";
        resume.innerHTML = `
          ✅ Radios testées : <strong>${total}</strong><br>
          🟢 Fonctionnelles : <strong style="color:green">${ok}</strong><br>
          🔴 En erreur : <strong style="color:red">${ko}</strong>
        `;
      } catch (e) {
        resultats.innerHTML = `<p class="error">❌ Erreur de chargement du fichier radios.json</p>`;
      }
    }

    verifierRadios();
  </script>
</body>
</html>
