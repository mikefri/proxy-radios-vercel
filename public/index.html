<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test des flux radios</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      background-color: #0f0c29;
      background-image: radial-gradient(circle at top left, #0f0c29, #302b63, #24243e);
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      color: white;
      min-height: 100vh;
      padding-top: 120px;
    }
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(20, 20, 20, 0.8);
      backdrop-filter: blur(15px);
      padding: 20px 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0, 255, 255, 0.4);
    }
    h1 {
      font-size: 2.8em;
      margin: 0 0 10px;
      background: linear-gradient(90deg, #00ffe0, #ff00ff, #00ffe0);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: neonText 3s linear infinite;
    }
    @keyframes neonText {
      0% { background-position: 0% center; }
      50% { background-position: 100% center; }
      100% { background-position: 0% center; }
    }
    .stats {
      font-size: 1.2em;
      margin-top: 5px;
      color: #00ffe0;
    }
    .progress-bar {
      height: 20px;
      width: 80%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      margin: 30px auto;
    }
    .progress {
      height: 100%;
      width: 0;
      background: linear-gradient(to right, #00ffe0, #ff00ff);
      transition: width 0.3s ease-in-out;
    }
    #resultats {
      padding: 20px;
      display: none;
    }
    .radio-item {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 0, 255, 0.3);
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      margin-bottom: 15px;
    }
    .ok { color: #00ff88; font-weight: bold; }
    .ko { color: #ff5555; font-weight: bold; }
    #retour-container {
      display: none;
      text-align: center;
      margin-top: 40px;
    }
    #retour-container button {
      padding: 12px 24px;
      font-size: 1em;
      border: none;
      border-radius: 10px;
      background: #00ffe0;
      color: #000;
      cursor: pointer;
      transition: background 0.3s;
    }
    #retour-container button:hover {
      background: #00bfbf;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <h1>Vérification des flux radios</h1>
    <div class="stats" id="statistiques">Chargement...</div>
  </div>

  <div class="progress-bar">
    <div class="progress" id="progress"></div>
  </div>

  <div id="resultats"></div>

  <div id="retour-container">
    <button onclick="history.back()">← Retour à la page précédente</button>
  </div>

  <script>
    const resultats = document.getElementById("resultats");
    const progress = document.getElementById("progress");
    const stats = document.getElementById("statistiques");

    async function verifierRadios() {
      try {
        const res = await fetch("https://raw.githubusercontent.com/mikefri/radios-data/refs/heads/main/radios.json");
        const radios = await res.json();

        let total = radios.length;
        let okCount = 0;
        let koCount = 0;

        resultats.innerHTML = "";
        resultats.style.display = "block";

        for (let i = 0; i < total; i++) {
          const radio = radios[i];
          const name = radio.name || "Sans nom";
          const url = radio.url || radio.stream;
          if (!url) continue;

          const div = document.createElement("div");
          div.className = "radio-item";
          div.innerHTML = `<strong>${name}</strong> : <em>Test en cours...</em>`;
          resultats.appendChild(div);

          try {
            const response = await fetch(`/api/check?url=${encodeURIComponent(url)}`);
            const data = await response.json();

            if (data.ok && data.contentType.startsWith("audio")) {
              div.innerHTML = `<strong>${name}</strong> : <span class="ok">OK</span>`;
              okCount++;
            } else {
              div.innerHTML = `<strong>${name}</strong> : <span class="ko">Problème (${data.status})</span>`;
              koCount++;
            }
          } catch (err) {
            div.innerHTML = `<strong>${name}</strong> : <span class="ko">Erreur</span>`;
            koCount++;
          }

          const progressPercent = Math.round(((i + 1) / total) * 100);
          progress.style.width = `${progressPercent}%`;
          stats.innerHTML = `Radios testées : ${i + 1}/${total} — OK : ${okCount} — KO : ${koCount}`;
        }

        document.getElementById("retour-container").style.display = "block";
      } catch (e) {
        stats.textContent = "Erreur de chargement du fichier radios.json.";
      }
    }

    verifierRadios();
  </script>
</body>
</html>
