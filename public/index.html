<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test des flux radios</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Ton style donné précédemment */
    * { box-sizing: border-box; }

    body {
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      background-color: #0f0c29;
      background-image: radial-gradient(circle at top left, #0f0c29, #302b63, #24243e);
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      color: white;
      min-height: 100vh;
    }

    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(20, 20, 20, 0.8);
      backdrop-filter: blur(15px);
      padding: 20px 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0, 255, 255, 0.4);
    }

    h1 {
      font-size: 2.8em;
      margin: 0 0 10px;
      background: linear-gradient(90deg, #00ffe0, #ff00ff, #00ffe0);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: neonText 3s linear infinite;
    }

    @keyframes neonText {
      0% { background-position: 0% center; }
      50% { background-position: 100% center; }
      100% { background-position: 0% center; }
    }

    #stats {
      margin-top: 10px;
      font-size: 1.1em;
      color: #00ffe0;
    }

    #progressBarContainer {
      width: 80%;
      height: 14px;
      margin: 30px auto 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    #progressBar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00ffe0, #ff00ff);
      transition: width 0.3s ease;
    }

    #testTable {
      margin: 320px auto 50px;
      width: 90%;
      max-width: 1000px;
      border-collapse: collapse;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      overflow: hidden;
      display: none;
    }

    #testTable th, #testTable td {
      padding: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      text-align: left;
    }

    #testTable th {
      background-color: rgba(0, 255, 255, 0.2);
      color: #00ffe0;
    }

    .ok { color: #00ff99; font-weight: bold; }
    .ko { color: #ff0077; font-weight: bold; }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>Vérification des flux radios</h1>
    <div id="stats">
      Radios testées : <span id="countTotal">0</span> |
      OK : <span id="countOK">0</span> |
      KO : <span id="countKO">0</span>
    </div>
    <div id="progressBarContainer">
      <div id="progressBar"></div>
    </div>
  </div>

  <table id="testTable">
    <thead>
      <tr>
        <th>Nom</th>
        <th>URL</th>
        <th>Statut</th>
      </tr>
    </thead>
    <tbody id="resultats"></tbody>
  </table>

  <script>
    const resultats = document.getElementById("resultats");
    const progressBar = document.getElementById("progressBar");
    const countTotal = document.getElementById("countTotal");
    const countOK = document.getElementById("countOK");
    const countKO = document.getElementById("countKO");
    const testTable = document.getElementById("testTable");

    let okCount = 0;
    let koCount = 0;
    let totalCount = 0;
    let testedCount = 0;

    function updateProgress() {
      const progress = (testedCount / totalCount) * 100;
      progressBar.style.width = `${progress}%`;
    }

    async function verifierRadios() {
      try {
        const res = await fetch("https://raw.githubusercontent.com/mikefri/radios-data/refs/heads/main/radios.json");
        const radios = await res.json();

        totalCount = radios.length;
        countTotal.textContent = totalCount;
        updateProgress();

        for (const radio of radios) {
          const name = radio.name || "Sans nom";
          const url = radio.url || radio.stream;

          if (!url) continue;

          const row = document.createElement("tr");
          const cellName = document.createElement("td");
          const cellUrl = document.createElement("td");
          const cellStatus = document.createElement("td");

          cellName.textContent = name;
          cellUrl.innerHTML = `<a href="${url}" target="_blank" style="color: #fff; text-decoration: underline;">Voir</a>`;
          cellStatus.innerHTML = '⏳ En test...';

          row.appendChild(cellName);
          row.appendChild(cellUrl);
          row.appendChild(cellStatus);
          resultats.appendChild(row);

          try {
            const response = await fetch(`/api/check?url=${encodeURIComponent(url)}`);
            const data = await response.json();

            if (data.ok && data.contentType.startsWith("audio")) {
              cellStatus.innerHTML = '<span class="ok">OK</span>';
              okCount++;
            } else {
              cellStatus.innerHTML = `<span class="ko">Problème (${data.status})</span>`;
              koCount++;
            }
          } catch (err) {
            cellStatus.innerHTML = '<span class="ko">Erreur</span>';
            koCount++;
          }

          testedCount++;
          updateProgress();

          countOK.textContent = okCount;
          countKO.textContent = koCount;
          countTotal.textContent = testedCount;
        }

        testTable.style.display = "table";
      } catch (e) {
        document.body.innerHTML = "<p style='color: red; text-align: center; margin-top: 300px;'>Erreur de chargement du fichier radios.json.</p>";
      }
    }

    verifierRadios();
  </script>

</body>
</html>
